<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AdoptiHub</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar"><a class="brand" th:href="@{/}">AdoptiHub</a><nav class="nav"><a th:href="@{/pets}">Pets</a><a th:href="@{/login}">Login</a></nav></header>
<main class="container">
    <section class="card">
        <h1>Create account</h1>
        <form class="stack" th:action="@{/register}" th:object="${registerRequest}" method="post">
            <div class="alert error" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
            <label>Username <input th:field="*{username}" required></label>
            <div class="muted" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            <label>Email <input th:field="*{email}" type="email" required></label>
            <div class="muted" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            <label>Password <input th:field="*{password}" type="password" required></label>
            <div class="muted" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            <button>Create account</button>
        </form>
    </section>
</main>
</body>
</html>

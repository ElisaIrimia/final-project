<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - AdoptiHub</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar"><a class="brand" th:href="@{/}">AdoptiHub Admin</a><nav class="nav"><a th:href="@{/pets}">Public catalog</a><form th:action="@{/logout}" method="post"><button class="btn secondary">Logout</button></form></nav></header>
<main class="container">
    <div class="alert success" th:if="${success}" th:text="${success}"></div>
    <div class="section-title"><h1>Admin dashboard</h1><div class="actions"><a class="btn" th:href="@{/admin/pets/new}">New pet</a><a class="btn secondary" th:href="@{/admin/shelters/new}">New shelter</a></div></div>
    <section class="card">
        <h2>Pets</h2>
        <table>
            <thead><tr><th>Name</th><th>Species</th><th>Status</th><th>Shelter</th><th>Actions</th></tr></thead>
            <tbody>
            <tr th:each="pet : ${pets}">
                <td th:text="${pet.name}"></td>
                <td th:text="${pet.species}"></td>
                <td><span class="badge" th:classappend="' status-' + ${pet.status}" th:text="${pet.status}"></span></td>
                <td th:text="${pet.shelter.name}"></td>
                <td class="actions"><a class="btn secondary" th:href="@{/admin/pets/{id}/edit(id=${pet.id})}">Edit</a><form th:action="@{/admin/pets/{id}/delete(id=${pet.id})}" method="post"><button class="btn danger">Delete</button></form></td>
            </tr>
            </tbody>
        </table>
    </section>
    <section class="card" style="margin-top:18px">
        <h2>Adoption applications</h2>
        <table>
            <thead><tr><th>Applicant</th><th>Pet</th><th>Motivation</th><th>Status</th><th>Decision</th></tr></thead>
            <tbody>
            <tr th:each="application : ${applications}">
                <td th:text="${application.applicant.username}"></td>
                <td th:text="${application.pet.name}"></td>
                <td th:text="${application.motivation}"></td>
                <td><span class="badge" th:classappend="' status-' + ${application.status}" th:text="${application.status}"></span></td>
                <td class="actions">
                    <form th:action="@{/admin/applications/{id}/APPROVED(id=${application.id})}" method="post"><button>Approve</button></form>
                    <form th:action="@{/admin/applications/{id}/REJECTED(id=${application.id})}" method="post"><button class="btn danger">Reject</button></form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>

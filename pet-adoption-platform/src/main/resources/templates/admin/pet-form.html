<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Form - AdoptiHub</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar"><a class="brand" th:href="@{/dashboard}">AdoptiHub Admin</a></header>
<main class="container">
    <section class="card">
        <h1>Pet profile</h1>
        <form class="stack" th:action="@{/admin/pets}" th:object="${pet}" method="post">
            <input type="hidden" th:field="*{id}">
            <label>Name <input th:field="*{name}" required></label>
            <label>Species <input th:field="*{species}" required></label>
            <label>Breed <input th:field="*{breed}" required></label>
            <label>Age <input th:field="*{age}" type="number" min="0" max="30"></label>
            <label>Status <select th:field="*{status}"><option th:each="status : ${statuses}" th:value="${status}" th:text="${status}"></option></select></label>
            <label>Shelter <select th:field="*{shelter}"><option th:each="shelter : ${shelters}" th:value="${shelter.id}" th:text="${shelter.name}"></option></select></label>
            <label>Story <textarea th:field="*{story}" required></textarea></label>
            <button>Save pet</button>
        </form>
    </section>
</main>
</body>
</html>

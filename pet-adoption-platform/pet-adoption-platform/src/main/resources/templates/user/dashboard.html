<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - AdoptiHub</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar"><a class="brand" th:href="@{/}">AdoptiHub</a><nav class="nav"><a th:href="@{/pets}">Pets</a><form th:action="@{/logout}" method="post"><button class="btn secondary">Logout</button></form></nav></header>
<main class="container">
    <div class="alert success" th:if="${success}" th:text="${success}"></div>
    <h1 th:text="'Welcome, ' + ${user.username}">Welcome</h1>
    <section class="card">
        <h2>My adoption applications</h2>
        <table>
            <thead><tr><th>Pet</th><th>Status</th><th>Sent at</th><th>Action</th></tr></thead>
            <tbody>
            <tr th:each="application : ${applications}">
                <td th:text="${application.pet.name}"></td>
                <td><span class="badge" th:classappend="' status-' + ${application.status}" th:text="${application.status}"></span></td>
                <td th:text="${#temporals.format(application.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                <td>
                    <form th:if="${application.status.name() == 'PENDING'}" th:action="@{/applications/{id}/cancel(id=${application.id})}" method="post">
                        <button class="btn danger">Cancel</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
